<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area 69 Survivor</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #18302d 0, #091311 42%, #030706 100%);
      color: #f4fff8;
    }
    .card {
      width: min(92vw, 560px); padding: 42px 34px; text-align: center;
      border: 1px solid rgba(123,255,183,.35); border-radius: 24px;
      background: rgba(5,16,13,.88); box-shadow: 0 0 50px rgba(77,255,151,.12);
    }
    .alien { font-size: 72px; }
    h1 { margin: 8px 0 0; font-size: clamp(42px, 9vw, 72px); letter-spacing: 4px; }
    h2 { margin: 6px 0 28px; font-weight: 500; color: #7bffb7; letter-spacing: 2px; }
    p { color: #c9d8d0; line-height: 1.6; }
    .status {
      display: inline-block; margin-top: 18px; padding: 10px 16px;
      border: 1px solid #7bffb7; border-radius: 999px; color: #7bffb7;
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="alien">👽</div>
    <h1>AREA 69</h1>
    <h2>SURVIVOR</h2>
    <p>Mission Control is coming online.</p>
    <p>The Area 69 competition portal is being prepared for deployment.</p>
    <div class="status">SYSTEM ONLINE</div>
  </main>
</body>
</html>
